name: Security - secret scanning

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: v8.30.1
        run: go install github.com/zricethezav/gitleaks/v8@"$GITLEAKS_VERSION"

      - name: Scan repository contents
        run: |
          "$(go env GOPATH)/bin/gitleaks" dir . \
            --config .gitleaks.toml \
            --redact \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks.json" \
            --no-banner

      - name: Upload secret scanning report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.json
          if-no-files-found: error
          retention-days: 30
