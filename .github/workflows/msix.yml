name: msix

# Empaqueta la suite Windows como MSIX para la Microsoft Store (makeappx).
# Manual (workflow_dispatch) o al etiquetar una versión v*.
#
# Para un paquete válido de Store, definir los secretos/variables del
# Partner Center: MSIX_IDENTITY_NAME y MSIX_PUBLISHER. Sin ellos se usa una
# identidad de prueba (válida para validar el paquete, no para publicar).

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Identity/Name del Partner Center (vacío = valor de prueba)'
        required: false
        default: ''
      publisher:
        description: 'Publisher del Partner Center, formato CN=... (vacío = valor de prueba)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: msix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-msix:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Instalar Qt 6 (MSVC)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Entorno MSVC (nmake)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Construir frontend Qt/QML
        shell: pwsh
        run: ./packaging/windows/build-desktop-qml.ps1

      - name: Construir suite Windows
        shell: pwsh
        run: ./packaging/windows/build-suite.ps1

      - name: Empaquetar MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ github.event.inputs.identity_name }}
          MSIX_PUBLISHER: ${{ github.event.inputs.publisher }}
        run: ./packaging/windows/build-msix.ps1

      - name: Subir artefacto MSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msix
          path: |
            release/windows-msix/*.msix
            release/windows-msix/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
