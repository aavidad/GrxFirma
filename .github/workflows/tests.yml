name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Obliga a que los tests que validan artefactos con herramientas externas
      # (qpdf, pdfsig, openssl) FALLEN si la herramienta no está, en vez de
      # saltarse la validación en silencio. Ver internal/testsupport/exttools.
      GRXFIRMA_REQUIRE_EXTERNAL_TOOLS: "1"
      # El aislamiento es obligatorio: un prerrequisito ausente debe fallar.
      GRXFIRMA_REQUIRE_PKCS11_SANDBOX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install external validators (qpdf, poppler, nss, openssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qpdf \
            poppler-utils \
            libnss3-tools \
            libnss3-dev \
            openssl \
            xmlsec1

      - name: Report validator versions
        run: |
          qpdf --version | head -1
          pdfsig -v 2>&1 | head -1 || true
          openssl version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # third_party/ queda fuera igual que en staticcheck: es un fork
      # vendorizado y su formato no es responsabilidad de este repo.
      - name: Gofmt
        run: |
          sin_formato="$(gofmt -l ./internal ./cmd ./presentation ./test ./scripts ./mobilebind)"
          if [ -n "$sin_formato" ]; then
            echo "Ficheros sin gofmt:" >&2
            echo "$sin_formato" >&2
            exit 1
          fi

      - name: Test CI scripts
        run: python3 -m unittest discover -s scripts/ci/tests -v

      - name: Enforce no-runtime-plugins architecture
        run: python3 scripts/ci/check_no_runtime_plugins.py

      # third_party/ queda fuera a propósito: es un fork vendorizado y el ruido
      # upstream no es accionable aquí. Los símbolos usados solo bajo
      # -tags fyne_gui llevan //lint:ignore U1000 (staticcheck corre sin tags).
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1 ./internal/... ./cmd/...

      # El ejecutor de GitHub trae carpetas del sistema con escritura para
      # todos (p. ej. /usr/share y el propio fichero de zona horaria en 777)
      # en la ruta de /etc/localtime. El
      # aislamiento PKCS11 rechaza con razón un fichero que cualquiera puede
      # cambiar. Se corrige el ejecutor, no la política del producto.
      - name: Quitar escritura ajena en la ruta de la zona horaria
        run: |
          set -euo pipefail
          destino="$(readlink -f /etc/localtime)"
          carpeta="${destino}"
          while [ "${carpeta}" != "/" ]; do
            if [ "$(stat -c %u "${carpeta}")" = "0" ] && [ -n "$(find "${carpeta}" -maxdepth 0 -perm /022)" ]; then
              echo "Se quita la escritura ajena de ${carpeta} ($(stat -c %a "${carpeta}"))"
              sudo chmod go-w "${carpeta}"
            fi
            carpeta="$(dirname "${carpeta}")"
          done

      - name: Test (validación externa obligatoria)
        run: go test ./...

      # No se desactiva AppArmor a ciegas: un rechazo de recursos ocurre antes
      # de arrancar bwrap. Este diagnóstico distingue permisos/enlaces y userns.
      - name: Diagnóstico de aislamiento PKCS11 tras un fallo
        if: ${{ failure() }}
        run: >-
          go test -v -count=1 -timeout=1m
          -run '^TestSandboxSystemDiagnostics$'
          ./internal/adapters/outbound/desktop/pkcs11worker/

      - name: Vet vendored PDF signing module
        working-directory: third_party/pdfsign
        run: go vet ./...

      - name: Test vendored PDF signing module
        working-directory: third_party/pdfsign
        run: go test -count=1 -timeout=10m ./...

      - name: Vet vendored PDF reader module
        working-directory: third_party/pdf
        run: go vet ./...

      - name: Test vendored PDF reader module
        working-directory: third_party/pdf
        run: go test -count=1 ./...

      # Variante nativa del catálogo NSS (libnss3 vía CGo, opt-in con
      # -tags nss_cgo). Prueba contra una base NSS real creada con certutil.
      - name: Test NSS CGo
        run: |
          go vet -tags nss_cgo ./internal/adapters/outbound/desktop/nssstore/
          go test -tags nss_cgo ./internal/adapters/outbound/desktop/nssstore/ -count=1

      - name: Release security gate
        run: ./scripts/release/check-release-gate.sh
