spdx = "SPDX-License-Identifier: EUPL-1.2"

[central_coverage]
copyright = "Derechos de autor (C) 2026 Alberto Avidad Fernández."
authorship = "Autoría: Alberto Avidad Fernández"
license_notice = "Licencia: EUPL 1.2 o posterior"
spdx = "SPDX-License-Identifier: EUPL-1.2"
categories = [
  "binary-resource",
  "generated",
  "json",
  "uncommentable",
]

[classification]
inline_extensions = [
  ".1",
  ".7",
  ".adml",
  ".admx",
  ".bat",
  ".bats",
  ".bk",
  ".c",
  ".cs",
  ".cpp",
  ".csproj",
  ".css",
  ".desktop",
  ".entitlements",
  ".go",
  ".h",
  ".html",
  ".in",
  ".js",
  ".kt",
  ".kts",
  ".m",
  ".manifest",
  ".md",
  ".mjs",
  ".mod",
  ".nsh",
  ".nsi",
  ".plist",
  ".pro",
  ".properties",
  ".props",
  ".ps1",
  ".py",
  ".qml",
  ".qrc",
  ".rb",
  ".rc",
  ".sh",
  ".svg",
  ".swift",
  ".tmpl",
  ".toml",
  ".xaml",
  ".xcconfig",
  ".xcprivacy",
  ".xml",
  ".yml",
]
inline_filenames = [
  ".gitattributes",
  ".gitignore",
  ".gitleaksignore",
  "Makefile",
  "pre-push",
]
json_extensions = [".json"]
binary_resource_extensions = [
  ".cer",
  ".crt",
  ".csig",
  ".hash",
  ".hexhash",
  ".ico",
  ".jar",
  ".jpeg",
  ".jpg",
  ".odt",
  ".pdf",
  ".png",
  ".syso",
  ".xsig",
  ".zip",
]
uncommentable_extensions = [
  ".lockfile",
  ".pbxproj",
  ".sln",
  ".sum",
  ".txt",
  ".xcscheme",
]
uncommentable_filenames = [
  ".gitkeep",
]
license_text_filenames = ["LICENSE"]
generated_globs = [
  "**/packages.lock.json",
  "docs/generated/**",
  "mobile/android/app/gradle.lockfile",
  "mobile/ios/GrxFirma.xcodeproj/project.pbxproj",
  "mobile/ios/GrxFirma.xcodeproj/xcshareddata/xcschemes/GrxFirma.xcscheme",
]
central_fixture_paths = [
  "internal/adapters/outbound/common/signer/testdata/sample-facturae.xml",
  "test/regression/fixtures/v1/samples/2.txt",
  "test/regression/fixtures/v1/samples/2.xml",
]

