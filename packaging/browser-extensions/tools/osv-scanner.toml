[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-02-14
reason = "deepmerge 4.3.1 (sin versión corregida) llega por web-ext > addons-linter, que solo mezcla la configuración y el manifiesto de nuestra propia extensión al validarla en la construcción. Quien controlara esa entrada ya controla el código de la extensión. Revisar si sale una versión corregida."
