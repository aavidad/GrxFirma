# Excepciones del control de dependencias para las herramientas que solo se
# usan al construir y firmar la extensión de Firefox. Nada de esto se instala
# en los equipos de los usuarios. Cada excepción caduca para obligar a revisarla.

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-02-14
reason = "Revisión 2026-11-14: comprobado en el registro npm deepmerge 4.3.1 (última publicación de 2023, sin versión corregida) y web-ext 10.8.0 (última versión); cadena web-ext 10.8.0 > addons-linter 10.14.0 > deepmerge 4.3.1. Solo mezcla configuración y manifiesto propios al validar/construir Firefox; no se distribuye al usuario. Quien controla esa entrada ya controla el código de la extensión. Se mantiene la excepción existente sin ampliar caducidad; revisar sustitución compatible con construcción y validación de la extensión antes de aplicar overrides. Evidencia y aceptación pendiente de Alberto en docs/dependencias/0.0.127/README.md."
