<html lang="es">
<head>
  <meta charset="UTF-8">
  <title data-i18n="extensionName"></title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">

    <header class="header">
      <img src="icons/Logo-Color.png" alt="">
      <div><h1 data-i18n="extensionName"></h1><p data-i18n="popupIntro"></p></div>

  <script src="compat.js"></script>
  <script src="popup.js"></script>
