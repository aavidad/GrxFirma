AntiFeatures:
  NonFreeNet:
    en-US: Optional, user-initiated check of a Spanish tax QR code against the
      Spanish Tax Agency (AEAT) service. Signing and verification work offline.
    es-ES: Cotejo opcional, a petición del usuario, de un QR tributario con el
      servicio de la Agencia Tributaria (AEAT). Firmar y verificar funciona sin
      conexión.
