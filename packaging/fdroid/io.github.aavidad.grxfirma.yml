Builds:
  - versionName: 0.0.127
    versionCode: 127
    commit: b8902d63bf7b110bb7777a38f4e5af43c54b371c
    subdir: mobile/android
    sudo:
      - apt-get update
      - apt-get install -y curl python3
      - curl -fsSL -o /tmp/go.tar.gz https://go.dev/dl/go1.26.11.linux-amd64.tar.gz
      - echo '9849f4e04ee35303714e34fbc3ac8ab44ea3e448a95aa182f91e3b9b79c710ec  /tmp/go.tar.gz'
        | sha256sum -c -
      - tar -C /opt -xzf /tmp/go.tar.gz
      - rm /tmp/go.tar.gz
    output: app/build/outputs/apk/production/release/app-production-release-unsigned.apk
    prebuild: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
    scandelete:
      - cmd/grxfirmauri/grxfirmauri_windows_amd64.syso
      - cmd/nativehost/nativehost_windows_amd64.syso
      - tests/certificates
    build:
      - export PATH="/opt/go/bin:$PATH" GOTOOLCHAIN=local
      - export ANDROID_HOME="$$SDK$$" ANDROID_SDK_ROOT="$$SDK$$" ANDROID_NDK_HOME="$$NDK$$"
      - cd ../..
      - scripts/mobile/android/build-core-aar.sh mobile/android/app/core/grxfirma.aar
      - export GRXFIRMA_ANDROID_CORE_AAR="$PWD/mobile/android/app/core/grxfirma.aar"
      - export GRXFIRMA_ANDROID_CORE_SHA256="$(sha256sum "$GRXFIRMA_ANDROID_CORE_AAR"
        | cut -d ' ' -f1)"
      - export GRXFIRMA_ANDROID_SOURCE_COMMIT="$(git rev-parse HEAD)"
      - export GRXFIRMA_FDROID_BUILD=1
      - export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" TZ=UTC
      - cd mobile/android
      - ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean assembleProductionRelease
    ndk: r28c

AutoUpdateMode: Version
# checkupdates solo extrae un entero; no ejecuta la fórmula de Gradle.
# El fichero se mantiene junto a VERSION.txt en las próximas etiquetas.
# La 0.0.127 carece de él: su Build queda fijado arriba y no se modifica.
UpdateCheckMode: Tags ^v?(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\Z
UpdateCheckData: mobile/android/fdroid-version.properties|(?m)^versionCode=([0-9]+)\s*$|VERSION.txt|^([0-9]+\.[0-9]+\.[0-9]+)\s*$
CurrentVersion: 0.0.127
CurrentVersionCode: 127
