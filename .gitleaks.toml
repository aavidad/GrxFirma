title = "GrxFirma secret scanning policy"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic test PKI for the v2 verification cases; never trusted outside tests"
targetRules = ["private-key"]
paths = ['''^testdata/dictamen-v2/pki/[a-z-]+\.key\.pem$''']

[[allowlists]]
description = "Name of the environment variable that carries the protection secret, not the secret"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^cmd/grxfirma/main\.go$''']
regexes = ['''envProtectionToken\s*=\s*"GRXFIRMA_PROTECTION_SECRET_B64"''']

[[allowlists]]
description = "WebSocket RFC 6455 nonces used only in protocol tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^internal/adapters/inbound/legacy/websocket/adapter_test\.go$''']
regexes = ['''Sec-WebSocket-Key:''']

[[allowlists]]
description = "CLI option names that contain the word secret but no credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^internal/adapters/inbound/common/cli/adapter\.go$''']
regexes = ['''fs\.StringVar\(&cfg\.secretProteccionB64, "(?:protection-secret-b64|clave-proteccion-b64)", "", ""\)''']

[[allowlists]]
description = "Literal documentation placeholder in the local REST curl example"
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "line"
paths = ['''^cmd/grxfirma/main\.go$''']
regexes = ['''Authorization: Bearer valor-prueba''']

[[allowlists]]
description = "Synthetic CMS suffixes listed consecutively in an IPC path test"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''^internal/adapters/inbound/desktop/ipc/handler_test\.go$''']
regexes = ['''secreto\.txt\.encrypted\.p7m",\s*"secreto\.txt\.signedenveloped\.p7m''']

[[allowlists]]
description = "Catalog keys of ENI form labels (labelKey), not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^cmd/gui-qml/qml/EniPanel\.qml$''']
regexes = ['''labelKey:\s*"paridad\.lote3\.eni\.[a-z_]+"''']
